# ============================================
# ACTUATOR & MONITORING (PROD)
# ============================================
# Production: expose only health and metrics (security-hardened)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.export.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
# ============================================
# PROD PROFILE - Production Configuration
# ============================================
# Minimal logging to file with rotation

# Root logging level
logging.level.root=INFO

# Application package logging
logging.level.it.marconi.biblioteca=INFO

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging to file with rotation
logging.file.name=/var/log/app/biblioteca.log
logging.file.max-size=10MB
logging.file.max-history=30d
logging.file.total-size-cap=500MB

# File log pattern - compact format
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Console output - minimal
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %msg%n

# Production server settings
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security
server.compression.enabled=true
server.compression.min-response-size=1024
