# ============================================
# ACTUATOR & MONITORING (DEV)
# ============================================
# Development: expose all actuator endpoints
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.logback=true
management.metrics.enable.system=true
management.metrics.enable.tomcat=true
management.metrics.export.prometheus.enabled=true

# ============================================
# DEV PROFILE - Development Configuration
# ============================================
# Detailed logging for debugging with SQL queries visible

# Root logging level
logging.level.root=DEBUG

# Application package logging
logging.level.it.marconi.biblioteca=TRACE

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Spring logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# JPA/Hibernate configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Console output
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Development server settings
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true
