global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'biblioteca'
    environment: 'docker-compose'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files: []

# Scrape configurations
scrape_configs:
  - job_name: 'biblioteca-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['app-dev:8080']
        labels:
          instance: 'dev'
      - targets: ['app-prod:8080']
        labels:
          instance: 'prod'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
